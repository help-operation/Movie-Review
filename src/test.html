<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="javas.js" defer></script>
    <style>
        body {
            font-family: arial;
            padding: 20px;
            background: #f0f0f0;
        }

        #todo-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 400px;
            margin: auto;
        }
        ul{
            list-style: none;
            padding: 0;
        }
        li{
            padding: 8px;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
        }
        #add-task-btn{
            width: 100px;
            height: 30px;
            border-radius: 4px;
            border: none;
        }
        #task-input{
            width: 285px;
            height: 20px;
        }
        h2{
            text-align: center;
            margin-bottom: 50px;
        }
    </style>
</head>

<body>
    <div id="todo-container">
        <h2>My To-Do List</h2>
        <input type="text" id="task-input" placeholder="Enter a task">
        <button id="add-task-btn">Add New Task</button>
        <ul id="task-list"></ul>
    </div>

</body>

</html>
